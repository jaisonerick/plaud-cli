name: Deploy Whisper

on:
  push:
    branches: [main]
    paths:
      - services/whisper/**
      - .github/workflows/deploy-whisper.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-whisper
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/whisper

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install modal

      - run: modal deploy app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
